name: Unit Tests

on: [push, pull_request]

jobs:
    test:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: [8.1, 8.2, 8.3, 8.4, 8.5, 8.6]
                laravel: [10.*, 11.*, 12.*, 13.*]
                dependency-version: [prefer-stable]
                include:
                    -   laravel: 10.*
                        testbench: ^8.20
                    -   laravel: 11.*
                        testbench: ^9.0
                    -   laravel: 12.*
                        testbench: ^10.2
                    -   laravel: 13.*
                        testbench: ^11.0
                exclude:
                    -   laravel: 10.*
                        php: 8.4
                    -   laravel: 10.*
                        php: 8.5
                    -   laravel: 10.*
                        php: 8.6
                    -   laravel: 11.*
                        php: 8.1
                    -   laravel: 11.*
                        php: 8.5
                    -   laravel: 11.*
                        php: 8.6
                    -   laravel: 12.*
                        php: 8.1
                    -   laravel: 12.*
                        php: 8.6
                    -   laravel: 13.*
                        php: 8.1
                    -   laravel: 13.*
                        php: 8.2

        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependency-version }}
        steps:
            -   name: Checkout Code
                uses: actions/checkout@v7

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    extensions: curl, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, iconv
                    coverage: none

            -   name: Cache dependencies
                uses: actions/cache@v5
                with:
                    path: ~/.composer/cache/files
                    key: dependencies-${{ matrix.dependency-version }}-laravel-${{ matrix.laravel }}-php-${{ matrix.php }}-composer-${{ hashFiles('composer.json') }}

            -   name: Install dependencies
                run: |
                    composer config --no-plugins --no-scripts policy.advisories.block false
                    composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
                    composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
                    composer update --prefer-dist --no-interaction -W

            -   name: Composer Autoload
                run: composer dump-autoload --optimize

            -   name: Execute tests
                run: vendor/bin/phpunit
